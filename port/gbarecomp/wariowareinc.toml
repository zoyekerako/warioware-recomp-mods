# Erzeugt aus wariowareinc-main/wariowareinc.ld -- siehe port/gbarecomp/README.md.
#
# Der Decomp weiss Zeile fuer Zeile, welcher ROM-Bereich Code ist und welcher
# Daten. Ohne diese Bereiche dekodiert die Funktionssuche Grafik als Code und
# findet 48223 statt rund 5500 Funktionen.

[program]
name         = "WarioWare Inc.: Mega Microgame$"
id           = "wariowareinc"
load_address = 0x08000000
size         = 0x00800000
entry_pc     = 0x080000C0

[identity]
sha1 = "3f556448d290fa5406d6ed367fee16cc02387ad3"
md5  = "a2d26dc774cec9a0b47388a5dd727b03"

# Von der Laufzeit gelesen (run_game). Der Recompiler nutzt [identity],
# die Laufzeit [rom]/[bios] -- dieselbe Datei, zwei Verbraucher.
[rom]
path  = "rom.gba"
sha1  = "3f556448d290fa5406d6ed367fee16cc02387ad3"
crc32 = 0x785D8B8C

[bios]
path = "gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[video]
view_width = 240

# Funktionen, die der Finder nicht erreicht -- aus dem Laufprotokoll
# ("bridged") plus Namen aus dem Decomp. Ohne diese interpretiert die
# Laufzeit sie, statt sie kompiliert auszufuehren.

