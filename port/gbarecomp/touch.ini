# touch.ini -- Zeigerschema je Microgame.
#
# Neben die ausfuehrbare Datei legen, oder ueber WWMOD_TOUCH_TABLE=<Pfad>
# woanders hin. Eine Zeile je Microgame:
#
#     <Nummer> = off | tap | drag | both | flick
#
#     tap    Aufsetzen = A, kurzer Impuls.
#     hold   A gedrueckt, solange der Zeiger aufliegt.
#     drag   Ziehen = gehaltene Richtung. Fuer "Figur bewegen".
#     both   beides.
#     flick  Wischen = eine einzelne Flanke. Fuer Spiele, die
#            gPressedKeys lesen statt gCurrentKeys.
#     off    Zeiger aus, nur Tastatur.
#
# Die Nummer ist currentMicrogameID; mit "Microgame readout" im Mod-Menue
# steht sie waehrend des Spiels im Bild.
#
# ── Woher diese Vorschlaege kommen ───────────────────────────────────
#
# Nicht geraten. Jede Microgame-Beschreibung (Tabelle 0x083A6090, um 2
# gegen D_083A50E0 versetzt) traegt am Ende die Symbole, die das Spiel
# selbst fuer die Steuerung einblendet:
#
#     .e:1QR:0.3JUMP        QR = Knopf   (132 Fundstellen)
#     .e:1GH:0.3MOVE        GH = Richtung (76)
#                           OP (41), IJ (12), EF (4) ebenfalls Richtung
#                           KL und OJ je 1x, nach ihrem Verb (ATTACK,
#                           GUARD) als Knopf gewertet; CD 1x ohne Verb,
#                           ungedeutet und ohne Vorschlag
#
# nur Knopf -> tap, nur Richtung -> drag, beides -> both. Der Kommentar
# hinter jeder Zeile nennt Titel und Verben, damit der Grund sichtbar
# bleibt und ein Irrtum schnell zu finden ist.
#
# Was daraus NICHT folgt, ist flick: ob ein Microgame die Flanke oder den
# Pegel liest, steht in seinem Code, nicht im Text. Wo sich ein Spiel
# traege anfuehlt, ist "flick" der naechste Versuch.
#
# Zwischenbilder (D_083A50E0[i].unk8 == 6) bekommen "off": dort ist nichts
# zu bedienen. Die Beschreibungstabelle reicht nur bis Microgame 225; was
# danach kommt -- die letzten freischaltbaren Spiele -- bleibt ohne
# Vorschlag, weil es dafuer keinen Hinweis in den Daten gibt.
#
# Erzeugt von gen_touch_ini.py -- Aenderungen von Hand bleiben, solange
# das Skript nicht erneut darueberlaeuft.

